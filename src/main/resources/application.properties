# ==============================
# Datasource - PostgreSQL
# ==============================
spring.application.name=review
spring.datasource.url=jdbc:postgresql://localhost:5432/karyawan
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:12345678}

# Pool Hikari (opsional)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:ems-development-secret-key-2026-super-secure-minimum-32-characters}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ==============================
# File Upload
# ==============================
file.upload-dir=uploads
file.max-size=5242880
file.allowed-types=image/jpeg,image/png,image/webp

# ==============================
# CORS
# ==============================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://app.company.com}

# ==============================
# Redis (disabled for now)
# ==============================
redis.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ==============================
# Actuator
# ==============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
